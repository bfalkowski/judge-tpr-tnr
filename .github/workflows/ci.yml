name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      # Stub Jev backend: no key, no network, no cost.
      - run: python -m pytest -q tests
      - name: Phase 0 reproduces
        run: |
          python analysis/phase0.py > /dev/null
          git diff --exit-code phase0/results.json phase0/RESULTS.md
