name: judge
# Run one judge variant over one split, by hand. The run folder is uploaded
# as an artifact and committed to the `data` branch (runs/<run_id>/).
on:
  workflow_dispatch:
    inputs:
      variant:
        default: p2
      dataset:
        default: v2
      split:
        type: choice
        options: [dev, train, test]
        default: dev
      repeats:
        default: "2"
      backend:
        type: choice
        options: [stub, api]
        default: stub
      max_spend_usd:
        default: "1"

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest
    env:
      RUN_ID: gh${{ github.run_id }}-${{ inputs.variant }}-${{ inputs.dataset }}-${{ inputs.split }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - name: Run judge
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_BACKEND: ${{ inputs.backend == 'stub' && 'stub' || '' }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
        run: |
          python run_judge.py --variant ${{ inputs.variant }} --dataset ${{ inputs.dataset }} \
            --split ${{ inputs.split }} --repeats ${{ inputs.repeats }} --run-id $RUN_ID
      - name: Rates
        if: always() && hashFiles(format('runs/{0}/judgments.jsonl', env.RUN_ID)) != ''
        run: python analysis/rates.py runs/$RUN_ID | tee -a $GITHUB_STEP_SUMMARY
      - name: No secrets in run outputs
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_API_KEY" ] && grep -rqF "$TYPESAFE_API_KEY" runs 2>/dev/null; then
            echo "the API key appears in the run outputs; not uploading"; exit 1
          fi
          echo "SECRETS_OK=1" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ env.RUN_ID }}
          path: runs/${{ env.RUN_ID }}
          if-no-files-found: warn
      - name: Commit to data branch
        if: always() && env.SECRETS_OK == '1' && hashFiles(format('runs/{0}/judgments.jsonl', env.RUN_ID)) != ''
        run: |
          mv runs/$RUN_ID /tmp/$RUN_ID
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin data || true
            if git rev-parse --verify origin/data >/dev/null 2>&1; then
              git checkout -f -B data origin/data
            else
              git checkout -f --orphan data; git rm -rf -q . ; git clean -fdq
            fi
            mkdir -p runs; rm -rf runs/$RUN_ID; cp -r /tmp/$RUN_ID runs/$RUN_ID
            git add runs/$RUN_ID
            git commit -q -m "judge run $RUN_ID" || { echo "nothing new"; exit 0; }
            git push origin data && exit 0
            sleep 5
          done
          exit 1
