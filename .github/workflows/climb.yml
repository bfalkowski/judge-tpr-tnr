name: climb
# Run versions of paper 2's support agent on every v5 ticket for the
# hill-climbing study (hillclimb/DESIGN.md), one job per version. Each job's
# decisions are committed to the `data` branch under runs/<run_id>/.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'JSON list of {"label": "<arm>-<round>", "artifact": "<repo path to the artifact json>"}'
        required: true
      reps:
        default: "2"
      backend:
        type: choice
        options: [stub, api]
        default: stub
      max_spend_usd:
        description: "Spend cap per job"
        default: "0.3"

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    env:
      RUN_ID: gh${{ github.run_id }}-climb-${{ matrix.job.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bfalkowski/eval-run-validity
          ref: 12a0eef7c90b3b77b84953c81946398f2d1f84d7
          path: p2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - name: Run agent
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_BACKEND: ${{ inputs.backend == 'stub' && 'stub' || '' }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          P2_DIR: p2
        run: |
          set -o pipefail
          python hillclimb/agent.py --artifact "${{ matrix.job.artifact }}" --reps ${{ inputs.reps }} --run-id $RUN_ID 2>&1 | tee agent.log \
            || { echo "::error title=climb_agent::$(tail -n 5 agent.log | tr '\n' ' ' | cut -c1-900)"; exit 1; }
      - name: No secrets in run outputs
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          k=$(printf '%s' "$TYPESAFE_API_KEY" | tr -d '[:space:]')
          if [ -n "$k" ] && grep -rqF -- "$k" runs 2>/dev/null; then
            echo "the API key appears in the run outputs; not committing"; exit 1
          fi
          echo "SECRETS_OK=1" >> $GITHUB_ENV
      - name: Commit to data branch
        if: always() && env.SECRETS_OK == '1' && hashFiles(format('runs/{0}/decisions.jsonl', env.RUN_ID)) != ''
        run: |
          mv runs/$RUN_ID /tmp/$RUN_ID
          rm -rf p2
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin data || true
            if git rev-parse --verify origin/data >/dev/null 2>&1; then
              git checkout -f -B data origin/data
            else
              git checkout -f --orphan data; git rm -rf -q . ; git clean -fdq
            fi
            mkdir -p runs; rm -rf runs/$RUN_ID; cp -r /tmp/$RUN_ID runs/$RUN_ID
            git add runs/$RUN_ID
            git commit -q -m "climb run $RUN_ID" || { echo "nothing new"; exit 0; }
            git push origin data && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
